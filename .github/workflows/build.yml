name: Unzip and Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project archive
      run: |
        ARCHIVE_NAME="creed-unity.zip"
        unzip -q "$ARCHIVE_NAME" -d extracted_project
        
        PROJECT_DIR=$(dirname "$(find extracted_project -name "gradlew" -print -quit)")
        
        if [ "$PROJECT_DIR" != "." ] && [ -n "$PROJECT_DIR" ]; then
          echo "Found project in: $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/* ./
        else
          shopt -s dotglob
          mv extracted_project/* ./
        fi
        rm -rf "$ARCHIVE_NAME" extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
